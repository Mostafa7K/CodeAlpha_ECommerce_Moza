<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Moza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="register.html">

  <header id="site-header" class="site-header"></header>

  <main>
    <div class="container auth-wrapper">
      <div class="card auth-card">
        <div class="auth-card-header">
          <h1>Create your account</h1>
          <p>Sign up to save your details and track your orders.</p>
        </div>

        <div id="form-alert"></div>

        <form id="register-form" class="form" novalidate>
          <div class="form-field">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Jane Doe" required minlength="2" />
          </div>

          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" />
            <span class="form-hint">Must be at least 6 characters long.</span>
          </div>

          <div class="form-field">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required minlength="6" />
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">
            Create Account
          </button>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/register.js"></script>
</body>
</html>
