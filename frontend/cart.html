<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      var stored = localStorage.getItem('moza-theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <title>Your Cart — Moza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="cart.html">

  <header id="site-header" class="site-header"></header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-header" style="text-align:left; align-items:flex-start;">
          <h2>Your Cart</h2>
          <p>Review your selections before checking out.</p>
        </div>

        <div id="cart-content"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/cart-page.js"></script>
</body>
</html>
