<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      var stored = localStorage.getItem('moza-theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <title>Page Not Found — Moza</title>
  <link rel="icon" type="image/png" href="assets/moza.pfp3.png" />
  <link rel="apple-touch-icon" href="assets/moza.pfp3.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="404">

  <header id="site-header" class="site-header"></header>

  <main>
    <section class="error-page">
      <div class="error-content">
        <svg class="error-candle" viewBox="0 0 64 96" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- Drifting smoke -->
          <path d="M32 6c5 4 1 8 0 12" opacity="0.4" />
          <path d="M32 2c-5 4 -1 8 0 12" opacity="0.25" />
          <!-- Flame -->
          <path class="candle-flame" d="M32 20c4.5 5 6.5 8 6.5 11.5a6.5 6.5 0 0 1-13 0C25.5 28 27.5 25 32 20z" stroke="none" />
          <line x1="32" y1="32" x2="32" y2="40" />
          <!-- Jar -->
          <rect x="16" y="40" width="32" height="48" rx="6" />
          <line x1="16" y1="52" x2="48" y2="52" />
        </svg>

        <div class="error-code">404</div>
        <h1 class="error-title">This scent seems to have drifted away.</h1>
        <p class="error-message">
          The page you are looking for doesn’t exist or may have been moved.
          Let’s get you back to something warm and familiar.
        </p>

        <div class="error-actions">
          <a href="index.html" class="btn btn-primary btn-lg">Back to Home Page</a>
          <a href="index.html#shop" class="btn btn-outline btn-lg">Continue Shopping</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="js/layout.js"></script>
</body>
</html>
